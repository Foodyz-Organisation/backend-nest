services:
  - type: web
    name: foodyz-backend
    env: node
    plan: starter # Change to 'standard' or 'pro' for production
    buildCommand: npm install && npm run build
    startCommand: npm run start:prod
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000 # Render uses port 10000 by default, but PORT env var will override
      # Add your environment variables in Render dashboard instead of here for security
      # Required variables:
      # - MONGODB_URI (note: your code uses MONGODB_URI, not MONGO_URI)
      # - JWT_SECRET
      # - SUPABASE_URL
      # - SUPABASE_SERVICE_KEY
      # - SUPABASE_MEDIA_BUCKET_NAME
      # - CLARIFAI_API_KEY (or HUGGING_FACE_API_TOKEN)
      # - GOOGLE_SERVICE_ACCOUNT_JSON (or GOOGLE_APPLICATION_CREDENTIALS)
      # - FOOD_DETECTION_CREDENTIALS
      # - MAIL_HOST, MAIL_PORT, MAIL_USER, MAIL_PASSWORD, MAIL_FROM
      # - FRONTEND_URL (optional, for CORS)
      # - FIREBASE_PROJECT_ID, FIREBASE_CLIENT_EMAIL, FIREBASE_PRIVATE_KEY (optional)
      # - STRIPE_SECRET_KEY, STRIPE_PUBLISHABLE_KEY (optional)

