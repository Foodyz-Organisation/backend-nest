services:
  - type: web
    name: foodyz-backend
    env: node
    plan: starter
    # Using npx to ensure nest CLI is found even if in devDependencies
    buildCommand: npm install && npx nest build
    startCommand: npm run start:prod
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: MONGODB_URI
        sync: false
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SERVICE_KEY
        sync: false
      - key: SUPABASE_MEDIA_BUCKET_NAME
        value: uploads
      # Add other environment variables as needed
      # - key: JWT_SECRET
      #   sync: false
      # - key: GEMINI_API_KEY
      #   sync: false
    # Note: For video thumbnail generation, ffmpeg must be available in the system
    # Render's build environment should include ffmpeg, but if you encounter issues,
    # you may need to use a Docker image or install ffmpeg via buildpack

